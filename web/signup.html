<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка — Уральская тропа</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav><a href="/">Главная</a> <a href="/routes">Маршруты</a> <a href="/trail">Конжаковский Камень</a> <a href="/about">О проекте</a></nav>
<main>
<h1>Заявка на маршрут</h1>
<p>Демонстрационная заявка. Оплата и реальное бронирование отсутствуют.</p>
<form method="post" action="/signup">
<label for="name">Имя</label>
<input type="text" id="name" name="name" required maxlength="100">
<label for="email">Электронная почта</label>
<input type="email" id="email" name="email" required maxlength="254">
<label for="route">Маршрут</label>
<select id="route" name="route" required>
<option value="konzhak">Конжаковский Камень</option>
<option value="taganay">Таганай</option>
<option value="iremel">Иремель</option>
</select>
<button type="submit">Отправить</button>
</form>
<div id="form-status" role="status" aria-live="polite"></div>
<script>
(function() {
  var form = document.querySelector('form');
  var status = document.getElementById('form-status');
  if (!form || !status) return;
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    status.textContent = 'Отправка…';
    var params = new URLSearchParams(new FormData(form));
    fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    }).then(function(res) {
      if (res.status === 201) {
        status.textContent = 'Демонстрационная заявка принята. Реальное бронирование не выполняется.';
      } else if (res.status === 400) {
        status.textContent = 'Ошибка: проверьте правильность заполнения полей.';
      } else {
        status.textContent = 'Непредвиденная ошибка. Попробуйте позже.';
      }
    }).catch(function() {
      status.textContent = 'Ошибка сети. Попробуйте позже.';
    });
  });
})();
</script>
</main>
</body>
</html>
