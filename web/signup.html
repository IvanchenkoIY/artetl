<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка — Уральская тропа</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav><a href="/">Главная</a> <a href="/routes">Маршруты</a> <a href="/trail">Конжаковский Камень</a></nav>
<main>
<h1>Демонстрационная заявка</h1>
<p>Это демонстрационная форма. Оплата и реальное бронирование отсутствуют. Заявка не является подтверждением места.</p>
<form method="post" action="/signup">
<label for="name">Имя</label>
<input type="text" id="name" name="name" required maxlength="100" autocomplete="name">
<label for="email">Электронная почта</label>
<input type="email" id="email" name="email" required maxlength="254" autocomplete="email">
<label for="route">Маршрут</label>
<select id="route" name="route" required>
<option value="konzhak">Конжаковский Камень</option>
<option value="taganay">Таганай</option>
<option value="iremel">Иремель</option>
</select>
<button type="submit">Отправить</button>
</form>
<p role="status" aria-live="polite"></p>
</main>
<script>
document.querySelector('form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const status = document.querySelector('[role=status]');
  status.textContent = 'Отправка…';
  try {
    const body = new URLSearchParams(new FormData(this));
    const res = await fetch('/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: body.toString()
    });
    if (res.status === 201) {
      status.textContent = 'Демонстрационная заявка принята. Это не реальное бронирование.';
    } else {
      status.textContent = 'Ошибка: проверьте правильность заполнения полей.';
    }
  } catch (err) {
    status.textContent = 'Ошибка сети. Попробуйте позже.';
  }
});
</script>
</body>
</html>
